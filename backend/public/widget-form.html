<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chamado</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 14px;
        background: #fff;
        padding: 24px;
        color: #1a1a2e;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 20px;
      }

      .header h3 {
        font-size: 16px;
        font-weight: 700;
      }

      .close-btn {
        background: none;
        border: none;
        font-size: 20px;
        cursor: pointer;
        color: #666;
        line-height: 1;
      }

      .type-selector {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
      }

      .type-btn {
        flex: 1;
        padding: 8px 4px;
        border: 1.5px solid #e0e0e0;
        border-radius: 8px;
        background: #fff;
        cursor: pointer;
        font-size: 12px;
        font-weight: 500;
        color: #555;
        transition: all 0.15s ease;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }

      .type-btn .icon {
        width: 18px;
        height: 18px;
        display: block;
      }

      /* Mesmas cores da central de chamados */
      .icon-help {
        color: #f59e0b;
      }
      .icon-bug {
        color: #ef4444;
      }
      .icon-suggestion {
        color: #6366f1;
      }

      .type-btn.selected {
        border-color: #1a1a2e;
        background: #1a1a2e;
        color: #fff;
      }

      label {
        display: block;
        margin-bottom: 4px;
        font-weight: 600;
        font-size: 13px;
        color: #333;
      }

      input,
      textarea {
        width: 100%;
        padding: 10px 12px;
        border: 1.5px solid #e0e0e0;
        border-radius: 8px;
        font-size: 14px;
        font-family: inherit;
        margin-bottom: 14px;
        transition: border-color 0.15s ease;
        outline: none;
      }

      input:focus,
      textarea:focus {
        border-color: #1a1a2e;
      }

      textarea {
        height: 100px;
        resize: vertical;
      }

      .error {
        color: #e53e3e;
        font-size: 12px;
        margin-top: -10px;
        margin-bottom: 12px;
      }

      .btn-row {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        margin-top: 4px;
      }

      button.cancel {
        padding: 10px 16px;
        border-radius: 8px;
        border: 1.5px solid #e0e0e0;
        background: #fff;
        color: #555;
        cursor: pointer;
        font-size: 14px;
        font-weight: 500;
      }

      button.send {
        padding: 10px 20px;
        border-radius: 8px;
        border: none;
        background: #1a1a2e;
        color: #fff;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
      }

      button.send:disabled {
        background: #aaa;
        cursor: not-allowed;
      }

      .powered {
        text-align: center;
        font-size: 11px;
        color: #bbb;
        margin-top: 16px;
      }

      .attach-box {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
        flex-wrap: wrap;
      }
      .attach-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 12px;
        border: 1.5px dashed #cfcfcf;
        border-radius: 8px;
        cursor: pointer;
        font-size: 13px;
        color: #444;
      }
      .attach-btn:hover {
        border-color: #1a1a2e;
      }
      .attach-btn svg {
        width: 15px;
        height: 15px;
      }
      .attach-hint {
        font-size: 11px;
        color: #999;
      }
      .attach-list {
        list-style: none;
        margin: 0 0 12px;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .attach-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        font-size: 12px;
        background: #f6f7f9;
        border: 1px solid #eee;
        border-radius: 6px;
        padding: 6px 10px;
      }
      .attach-item .name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .attach-remove {
        background: none;
        border: none;
        color: #e53e3e;
        cursor: pointer;
        font-size: 15px;
        line-height: 1;
        flex-shrink: 0;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h3>Abrir Chamado</h3>
      <button class="close-btn" id="btn-close" title="Fechar">×</button>
    </div>

    <!-- Seletor de tipo -->
    <div class="type-selector">
      <button class="type-btn" data-type="help">
        <svg
          class="icon icon-help"
          viewBox="0 0 512 512"
          fill="currentColor"
          aria-hidden="true"
        >
          <path
            d="M256 8C119.033 8 8 119.033 8 256s111.033 248 248 248 248-111.033 248-248S392.967 8 256 8zm173.696 119.559l-63.399 63.399c-10.987-18.559-26.67-34.252-45.255-45.255l63.399-63.399a218.396 218.396 0 0 1 45.255 45.255zM256 352c-53.019 0-96-42.981-96-96s42.981-96 96-96 96 42.981 96 96-42.981 96-96 96zM127.559 82.304l63.399 63.399c-18.559 10.987-34.252 26.67-45.255 45.255l-63.399-63.399a218.372 218.372 0 0 1 45.255-45.255zM82.304 384.441l63.399-63.399c10.987 18.559 26.67 34.252 45.255 45.255l-63.399 63.399a218.396 218.396 0 0 1-45.255-45.255zm302.137 45.255l-63.399-63.399c18.559-10.987 34.252-26.67 45.255-45.255l63.399 63.399a218.403 218.403 0 0 1-45.255 45.255z"
          />
        </svg>
        Ajuda
      </button>
      <button class="type-btn" data-type="bug">
        <svg
          class="icon icon-bug"
          viewBox="0 0 512 512"
          fill="currentColor"
          aria-hidden="true"
        >
          <path
            d="M511.988 288.9c-.478 17.43-15.217 31.1-32.653 31.1H424v16c0 21.864-4.882 42.584-13.6 61.145l60.228 60.228c12.496 12.497 12.496 32.758 0 45.255-12.498 12.497-32.759 12.496-45.256 0l-54.736-54.736C345.886 467.965 314.351 480 280 480V236c0-6.627-5.373-12-12-12h-24c-6.627 0-12 5.373-12 12v244c-34.351 0-65.886-12.035-90.636-32.108l-54.736 54.736c-12.498 12.497-32.759 12.496-45.256 0-12.496-12.497-12.496-32.758 0-45.255l60.228-60.228C92.882 378.584 88 357.864 88 336v-16H32.666C15.23 320 .491 306.33.013 288.9-.484 270.816 14.028 256 32 256h56v-58.745l-46.628-46.628c-12.496-12.497-12.496-32.758 0-45.255 12.498-12.497 32.758-12.497 45.256 0L141.255 160h229.489l54.627-54.627c12.498-12.497 32.758-12.497 45.256 0 12.496 12.497 12.496 32.758 0 45.255L424 197.255V256h56c17.972 0 32.484 14.816 31.988 32.9zM257 0c-61.856 0-112 50.144-112 112h224C369 50.144 318.856 0 257 0z"
          />
        </svg>
        Bug
      </button>
      <button class="type-btn" data-type="suggestion">
        <svg
          class="icon icon-suggestion"
          viewBox="0 0 352 512"
          fill="currentColor"
          aria-hidden="true"
        >
          <path
            d="M176 80c-52.94 0-96 43.06-96 96 0 8.84 7.16 16 16 16s16-7.16 16-16c0-35.3 28.72-64 64-64 8.84 0 16-7.16 16-16s-7.16-16-16-16zM96.06 459.17c0 3.15.93 6.22 2.68 8.84l24.51 36.84c2.97 4.46 7.97 7.14 13.32 7.14h78.85c5.36 0 10.36-2.68 13.32-7.14l24.51-36.84c1.74-2.62 2.67-5.7 2.68-8.84l.05-43.18H96.02l.04 43.18zM176 0C73.72 0 0 82.97 0 176c0 44.37 16.45 84.85 43.56 115.78 16.64 18.99 42.74 58.8 52.42 92.16v.06h48v-.12c-.01-4.77-.72-9.51-2.15-14.07-5.59-17.81-22.82-64.77-62.17-109.67-20.54-23.43-31.52-53.15-31.61-84.14-.2-73.64 59.67-128 127.95-128 70.58 0 128 57.42 128 128 0 30.97-11.24 60.85-31.65 84.14-39.11 44.61-56.42 91.47-62.1 109.46a47.507 47.507 0 0 0-2.22 14.3v.1h48v-.05c9.68-33.37 35.78-73.18 52.42-92.16C335.55 260.85 352 220.37 352 176 352 78.8 273.2 0 176 0z"
          />
        </svg>
        Sugestão
      </button>
    </div>

    <label for="fb-name">Solicitante</label>
    <input id="fb-name" type="text" placeholder="Seu nome completo" />
    <div class="error" id="err-name"></div>

    <label for="fb-email">E-mail</label>
    <input id="fb-email" type="email" placeholder="seu@email.com" />
    <div class="error" id="err-email"></div>

    <label for="fb-title">Título</label>
    <input id="fb-title" type="text" placeholder="Resumo em poucas palavras" />
    <div class="error" id="err-title"></div>

    <label for="fb-desc">Descrição</label>
    <textarea
      id="fb-desc"
      placeholder="Descreva com mais detalhes..."
    ></textarea>
    <div class="error" id="err-desc"></div>

    <label>Anexos (opcional)</label>
    <div class="attach-box">
      <label for="fb-files" class="attach-btn">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path
            d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"
          />
        </svg>
        Adicionar arquivos
      </label>
      <input
        id="fb-files"
        type="file"
        multiple
        accept="image/jpeg,image/png,image/gif,image/webp,application/pdf,.doc,.docx,.xls,.xlsx,.txt"
        hidden
      />
      <span class="attach-hint">Até 3 arquivos, 10 MB cada</span>
    </div>
    <ul class="attach-list" id="attach-list"></ul>
    <div class="error" id="err-files"></div>

    <div class="btn-row">
      <button class="cancel" id="btn-cancel">Cancelar</button>
      <button class="send" id="btn-send">Enviar</button>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const TOKEN = params.get("token");
      const ORIGIN = params.get("origin");
      const API_BASE = window.location.origin;

      let selectedType = "help";

      // Seletor de tipo
      document.querySelectorAll(".type-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          document
            .querySelectorAll(".type-btn")
            .forEach((b) => b.classList.remove("selected"));
          btn.classList.add("selected");
          selectedType = btn.getAttribute("data-type");
        });
      });

      // ── Anexos ──
      const MAX_FILES = 3;
      const MAX_SIZE = 10 * 1024 * 1024;
      const ALLOWED = [
        "image/jpeg",
        "image/png",
        "image/gif",
        "image/webp",
        "application/pdf",
        "application/msword",
        "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
        "application/vnd.ms-excel",
        "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
        "text/plain",
      ];
      let selectedFiles = [];
      const fileInput = document.getElementById("fb-files");
      const attachList = document.getElementById("attach-list");
      const errFiles = document.getElementById("err-files");

      function humanSize(bytes) {
        if (bytes < 1024) return bytes + " B";
        if (bytes < 1024 * 1024) return Math.round(bytes / 1024) + " KB";
        return (bytes / (1024 * 1024)).toFixed(1) + " MB";
      }

      function renderFiles() {
        attachList.innerHTML = "";
        selectedFiles.forEach((f, i) => {
          const li = document.createElement("li");
          li.className = "attach-item";
          const nameEl = document.createElement("span");
          nameEl.className = "name";
          nameEl.textContent = f.name + " · " + humanSize(f.size);
          const rm = document.createElement("button");
          rm.className = "attach-remove";
          rm.type = "button";
          rm.innerHTML = "&times;";
          rm.title = "Remover";
          rm.onclick = function () {
            selectedFiles.splice(i, 1);
            renderFiles();
          };
          li.appendChild(nameEl);
          li.appendChild(rm);
          attachList.appendChild(li);
        });
      }

      fileInput.addEventListener("change", function () {
        errFiles.innerText = "";
        for (const file of Array.from(fileInput.files)) {
          if (selectedFiles.length >= MAX_FILES) {
            errFiles.innerText = "Máximo de " + MAX_FILES + " arquivos.";
            break;
          }
          if (ALLOWED.indexOf(file.type) === -1) {
            errFiles.innerText = "Tipo não permitido: " + file.name;
            continue;
          }
          if (file.size > MAX_SIZE) {
            errFiles.innerText = file.name + " excede 10 MB.";
            continue;
          }
          const dup = selectedFiles.some(
            (f) => f.name === file.name && f.size === file.size,
          );
          if (dup) continue;
          selectedFiles.push(file);
        }
        fileInput.value = ""; // permite re-selecionar o mesmo arquivo
        renderFiles();
      });

      document.getElementById("btn-close").onclick = function () {
        window.parent.postMessage("fw:close", "*");
      };

      document.getElementById("btn-cancel").onclick = function () {
        window.parent.postMessage("fw:close", "*");
      };

      document.getElementById("btn-send").onclick = async function () {
        const name = document.getElementById("fb-name").value.trim();
        const email = document.getElementById("fb-email").value.trim();
        const title = document.getElementById("fb-title").value.trim();
        const description = document.getElementById("fb-desc").value.trim();

        if (!name) {
          document.getElementById("err-name").innerText =
            "Informe seu nome completo.";
          return;
        }
        document.getElementById("err-name").innerText = "";

        if (!email || !email.includes("@")) {
          document.getElementById("err-email").innerText =
            "Informe um e-mail válido.";
          return;
        }
        document.getElementById("err-email").innerText = "";

        if (!title) {
          document.getElementById("err-title").innerText = "Informe um título.";
          return;
        }
        document.getElementById("err-title").innerText = "";

        if (!description) {
          document.getElementById("err-desc").innerText =
            "Informe uma descrição.";
          return;
        }
        document.getElementById("err-desc").innerText = "";

        const btn = document.getElementById("btn-send");
        btn.disabled = true;
        btn.innerText = "Enviando...";

        try {
          const fd = new FormData();
          fd.append("token", TOKEN || "");
          fd.append("type", selectedType);
          fd.append("title", title);
          fd.append("name", name);
          fd.append("requester_email", email);
          fd.append("description", description);
          if (ORIGIN) fd.append("origin_url", ORIGIN);
          selectedFiles.forEach((f) => fd.append("files", f));

          // Sem header Content-Type: o navegador define o boundary do multipart.
          const response = await fetch(`${API_BASE}/api/ticket`, {
            method: "POST",
            body: fd,
          });

          if (!response.ok) {
            let msg = "Erro ao enviar o ticket. Tente novamente.";
            try {
              const data = await response.json();
              if (data && data.error) msg = data.error;
            } catch (_) {}
            throw new Error(msg);
          }

          window.parent.postMessage("fw:submitted", "*");
        } catch (err) {
          btn.disabled = false;
          btn.innerText = "Enviar";
          alert(err.message || "Erro ao enviar o ticket. Tente novamente.");
        }
      };
    </script>
  </body>
</html>
